[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
junit = "6.1.3"
coroutines = "1.11.0"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"
kover = "0.9.11"
licensee = "1.14.1"
mockk = "1.14.11"
turbine = "1.2.1"
angusMail = "2.0.5"
angusActivation = "2.0.3"
jakartaActivation = "2.1.4"
greenmail = "2.1.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
